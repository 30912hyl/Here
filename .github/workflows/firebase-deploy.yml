# Deploys Firestore rules, Storage rules and Cloud Functions whenever a
# change to them lands on main. Needs one repository secret:
#   FIREBASE_SERVICE_ACCOUNT — the JSON of a Firebase service-account key
#   (Firebase console → Project settings → Service accounts → Generate new
#   private key), pasted whole.
name: Firebase deploy

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - functions/**
      - .github/workflows/firebase-deploy.yml
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Write service-account credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules + functions
        run: firebase deploy --only firestore:rules,storage,functions --project here-a6817 --non-interactive --force
